root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./backend/cmd/main.go"
  bin = "./tmp/server"
  include_ext = ["go"]
  exclude_dir = ["frontend", "db", "grafana", "prometheus", "tmp", ".git"]
  delay = 500

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true